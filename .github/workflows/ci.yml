name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_BASE_URL: http://127.0.0.1:3000
  APP_ENV: test
  DATABASE_URL: postgresql://siglum_app:siglum_ci_password@127.0.0.1:5432/siglum?schema=public
  DIRECT_URL: postgresql://siglum_app:siglum_ci_password@127.0.0.1:5432/siglum?schema=public
  LOG_LEVEL: info
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.28.8

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral authentication configuration
        shell: bash
        run: |
          secret() { openssl rand -base64 48 | tr '+/' '-_' | tr -d '='; }
          echo "BETTER_AUTH_SECRET=$(secret)" >> "$GITHUB_ENV"
          echo "AUTH_IDENTIFIER_HASH_KEY=$(secret)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "AUTH_TRUSTED_ORIGINS=http://127.0.0.1:3000" >> "$GITHUB_ENV"
          echo "AUTH_BOOTSTRAP_ENABLED=false" >> "$GITHUB_ENV"
          echo "AUTH_SESSION_EXPIRES_SECONDS=43200" >> "$GITHUB_ENV"
          echo "AUTH_SESSION_UPDATE_AGE_SECONDS=3600" >> "$GITHUB_ENV"
          echo "AUTH_ABSOLUTE_SESSION_MAX_AGE_SECONDS=604800" >> "$GITHUB_ENV"
          echo "AUTH_FAILED_LOGIN_WINDOW_SECONDS=900" >> "$GITHUB_ENV"
          echo "AUTH_FAILED_LOGIN_MAX_ATTEMPTS=10" >> "$GITHUB_ENV"
          echo "AUTH_FAILED_LOGIN_LOCK_SECONDS=900" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Check Better Auth schema parity
        run: pnpm auth:schema:check

      - name: Run authentication static security checks
        run: pnpm auth:security-check

      - name: Verify formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests and coverage
        run: pnpm test:coverage

      - name: Production build
        run: pnpm build

  e2e:
    name: E2E smoke
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral authentication configuration
        shell: bash
        run: |
          secret() { openssl rand -base64 48 | tr '+/' '-_' | tr -d '='; }
          echo "BETTER_AUTH_SECRET=$(secret)" >> "$GITHUB_ENV"
          echo "AUTH_IDENTIFIER_HASH_KEY=$(secret)" >> "$GITHUB_ENV"
          echo "BETTER_AUTH_URL=http://127.0.0.1:3100" >> "$GITHUB_ENV"
          echo "AUTH_TRUSTED_ORIGINS=http://127.0.0.1:3100" >> "$GITHUB_ENV"
          echo "AUTH_BOOTSTRAP_ENABLED=false" >> "$GITHUB_ENV"
          echo "AUTH_SESSION_EXPIRES_SECONDS=43200" >> "$GITHUB_ENV"
          echo "AUTH_SESSION_UPDATE_AGE_SECONDS=3600" >> "$GITHUB_ENV"
          echo "AUTH_ABSOLUTE_SESSION_MAX_AGE_SECONDS=604800" >> "$GITHUB_ENV"
          echo "AUTH_FAILED_LOGIN_WINDOW_SECONDS=900" >> "$GITHUB_ENV"
          echo "AUTH_FAILED_LOGIN_MAX_ATTEMPTS=10" >> "$GITHUB_ENV"
          echo "AUTH_FAILED_LOGIN_LOCK_SECONDS=900" >> "$GITHUB_ENV"

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --no-shell chromium

      - name: Run Chromium smoke tests
        run: pnpm test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  database:
    name: Database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_ADMIN_URL: postgresql://siglum_app:siglum_ci_password@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgresql://siglum_app:siglum_ci_password@127.0.0.1:5432/siglum_test?schema=public
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: siglum
          POSTGRES_PASSWORD: siglum_ci_password
          POSTGRES_USER: siglum_app
        options: >-
          --health-cmd "pg_isready -U siglum_app -d siglum" --health-interval 5s
          --health-timeout 5s --health-retries 12
        ports:
          - 5432:5432
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the isolated integration-test database
        run: >-
          node --input-type=module --eval "import { Client } from 'pg'; const client =
          new Client({ connectionString: process.env['POSTGRES_ADMIN_URL'] }); await
          client.connect(); await client.query('CREATE DATABASE siglum_test'); await
          client.end();"

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Apply reviewed migrations
        run: pnpm db:migrate

      - name: Seed deterministic data
        run: pnpm db:seed

      - name: Provide the local environment contract to the Node test runner
        run: cp .env.example .env.local

      - name: Run database integration tests
        run: pnpm test:integration

  docker:
    name: Docker verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag siglum-studio-web:ci .

      - name: Start and verify production container
        run: |
          secret() { openssl rand -base64 48 | tr '+/' '-_' | tr -d '='; }
          docker run --detach --name siglum-studio-ci --publish 3000:3000 \
            --env APP_ENV=production \
            --env APP_BASE_URL=https://localhost:3000 \
            --env DATABASE_URL=postgresql://build:build@localhost:5432/siglum \
            --env DIRECT_URL=postgresql://build:build@localhost:5432/siglum \
            --env LOG_LEVEL=info \
            --env BETTER_AUTH_URL=https://localhost:3000 \
            --env AUTH_TRUSTED_ORIGINS=https://localhost:3000 \
            --env BETTER_AUTH_SECRET="$(secret)" \
            --env AUTH_IDENTIFIER_HASH_KEY="$(secret)" \
            --env AUTH_BOOTSTRAP_ENABLED=false \
            --env AUTH_SESSION_EXPIRES_SECONDS=43200 \
            --env AUTH_SESSION_UPDATE_AGE_SECONDS=3600 \
            --env AUTH_ABSOLUTE_SESSION_MAX_AGE_SECONDS=604800 \
            --env AUTH_FAILED_LOGIN_WINDOW_SECONDS=900 \
            --env AUTH_FAILED_LOGIN_MAX_ATTEMPTS=10 \
            --env AUTH_FAILED_LOGIN_LOCK_SECONDS=900 \
            siglum-studio-web:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:3000/

      - name: Verify the full Compose stack
        run: |
          docker rm --force siglum-studio-ci
          cp .env.example .env.local
          secret() { openssl rand -base64 48 | tr '+/' '-_' | tr -d '='; }
          export BETTER_AUTH_SECRET="$(secret)"
          export AUTH_IDENTIFIER_HASH_KEY="$(secret)"
          export BETTER_AUTH_URL="http://127.0.0.1:3000"
          export AUTH_TRUSTED_ORIGINS="http://127.0.0.1:3000"
          if ! docker compose --env-file .env.local up --build --detach --wait --wait-timeout 240; then
            docker compose --env-file .env.local ps || true
            docker compose --env-file .env.local logs --no-color --tail=100 || true
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:3000/api/ready

      - name: Print container diagnostics
        if: failure()
        run: |
          docker logs siglum-studio-ci || true
          BETTER_AUTH_SECRET=ci_diagnostics AUTH_IDENTIFIER_HASH_KEY=ci_diagnostics \
            docker compose --env-file .env.local logs --no-color || true

      - name: Stop production container
        if: always()
        run: |
          docker rm --force siglum-studio-ci || true
          BETTER_AUTH_SECRET=ci_cleanup AUTH_IDENTIFIER_HASH_KEY=ci_cleanup \
            docker compose --env-file .env.local down --remove-orphans || true
