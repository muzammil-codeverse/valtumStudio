version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Temporary: pause routine version PRs during website and dashboard stabilization.
    # Security update PRs are handled separately by Dependabot.
    # Restore a positive limit for scheduled dependency maintenance.
    open-pull-requests-limit: 0
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
        update-types: [minor, patch]
      prisma:
        patterns:
          - prisma
          - "@prisma/client"
          - "@prisma/adapter-*"
        update-types: [minor, patch]
      better-auth:
        patterns:
          - auth
          - better-auth
          - "@better-auth/*"
        update-types: [minor, patch]
      next:
        patterns:
          - next
          - eslint-config-next
        update-types: [minor, patch]
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Temporary: keep GitHub Actions version-update noise paused as well.
    open-pull-requests-limit: 0
